embeddings_dir: outputs/embeddings
metadata_dir: outputs/metadata
scene_index_dir: outputs/scene_index
frame_cache_dir: outputs/frame_cache
caption_backend: ollama_vision
ollama_base_url: http://127.0.0.1:11434
ollama_model: llama3.2-vision:11b
ollama_text_model: llama3.1:8b
text_embedding_model: sentence-transformers/all-MiniLM-L6-v2
segment_source: dense_video
segment_length_seconds: 8.0
segment_stride_seconds: 8.0
min_segment_seconds: 2.0
frames_per_segment: 3
retrieval_mode: hybrid
caption_weight: 0.7
latent_weight: 0.3
top_k: 5
candidate_k: 15
enable_llm_reranking: true
enable_deduplication: true
duplicate_caption_threshold: 0.92
train_text_latent_aligner: true
min_alignment_pairs: 50
aligner_hidden_dim: 512
aligner_dropout: 0.1
aligner_epochs: 50
aligner_learning_rate: 0.0003
align_cosine_weight: 1.0
align_mse_weight: 0.1
coverage_required: true
min_coverage_ratio: 0.95
device: auto
seed: 42
