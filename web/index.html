<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V-JEPA Scene Search</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <h1>V-JEPA Scene Search</h1>
          <p>Upload a video and search for a scene using natural language.</p>
        </div>
      </header>
      <section class="searchPanel">
        <label class="field">
          <span>Video</span>
          <input id="videoInput" type="file" accept="video/*">
        </label>
        <label class="field">
          <span>Scene query</span>
          <input id="queryInput" type="text" placeholder="find the scene where someone enters the room">
        </label>
        <button id="searchButton" type="button">Search Video</button>
      </section>
      <section class="statusPanel" aria-live="polite">
        <div class="progress">
          <div id="progressBar"></div>
        </div>
        <p id="statusText">Waiting for a video and query.</p>
        <dl class="summary" id="summary" hidden>
          <div>
            <dt>Duration</dt>
            <dd id="durationText">-</dd>
          </div>
          <div>
            <dt>Segments</dt>
            <dd id="segmentsText">-</dd>
          </div>
          <div>
            <dt>Coverage</dt>
            <dd id="coverageText">-</dd>
          </div>
        </dl>
      </section>
      <section class="resultsSection">
        <div class="resultsHeader">
          <h2>Matching Scenes</h2>
          <span id="resultCount">0 results</span>
        </div>
        <div class="results" id="results"></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
